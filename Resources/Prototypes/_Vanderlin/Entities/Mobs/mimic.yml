# Активний стан
- type: entity
  id: MimicBaseCase
  name: скриня-мімік
  description: Ймовірно, вона хоче вас з'їсти... Тож не роздивляйтеся, якщо не бажаєте стати її обідом.
  parent: [ SimpleMobBase, MobCombat ]
  components:
  - type: Tag
    tags:
    - FootstepSound
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - VanderlinMonsters
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcFist
    damage:
      types:
        Blunt: 28
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5.5
  - type: Butcherable
    spawned:
    - id: DrinkChangelingStingCan # ЗАМІНИТИ НА СКАРБИ
      amount: 1

