- type: entity
  id: GrassTuft
  name: пучок трави
  description: Звичайна трава. З неї можна висмикнути нитку.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Vanderlin/Structures/foliage.rsi
    drawdepth: BelowMobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: grass1
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        grass1: ""
        grass2: ""
        grass3: ""
        grass4: ""
        grass5: ""
        grass6: ""
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      sense:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        hard: false
        layer:
        - LowImpassable
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Thread:
            min: 1
            max: 1
          DestroyedGrass:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

