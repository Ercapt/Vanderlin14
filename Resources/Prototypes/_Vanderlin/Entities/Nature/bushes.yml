- type: entity
  id: Bush
  name: кущ
  description: Звичайний кущ. Може, всередині щось є.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Bush
    thornChance: 0.3
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Vanderlin/Structures/foliage.rsi
    drawdepth: BelowMobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: bush
    - map: [ "empty" ]
      state: bush_empty_overlay
      visible: false
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        bush: ""
        bush1: ""
        bush2: ""
        bush3: ""
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BushVisuals.Depleted:
        empty:
          True: { state: bush_empty_overlay, visible: true }
          False: { state: bush_empty_overlay, visible: false }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      sense:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        hard: false
        layer:
        - LowImpassable

