- type: entity
  parent: [ BaseStructureDynamic, BasePaperLabelableVisualized ]
  id: ChestBase
  name: скриня
  description: Зручне сховище для речей, всередині точно щось цінне... Якщо це не так, спробуйте знайти іншу скриню.
  components:
  - type: Animateable
  - type: Transform
    noRot: true
  - type: Icon
    sprite: _Vanderlin/Structures/Storage/chest.rsi
    state: icon_chest_neu
  - type: Sprite
    noRot: true
    sprite: _Vanderlin/Structures/Storage/chest.rsi
    layers:
    - state: chest_neubase
      map: ["enum.StorageVisualLayers.Base"]
    - state: chest_neuopen
      map: ["enum.StorageVisualLayers.Door"]
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.29"
        density: 50
        mask:
        - CrateMask #this is so they can go under plastic flaps
        layer:
        - MachineLayer
  - type: EntityStorage
  - type: PlaceableSurface
    isPlaceable: false # defaults to closed.
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: EntityStorageVisuals
    stateDoorOpen: chest_neuopen
    stateDoorClosed: chest_neu_closed
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
      paper_label: !type:ContainerSlot
  - type: Construction
    graph: CrateGenericSteel
    node: crategenericsteel
    containers:
      - entity_storage
  - type: RequireProjectileTarget
  - type: Tag
    tags:
      - Crate

- type: entity
  parent: ChestBase
  id: GoldenChest
  name: оздоблена скриня
  description: Ця скриня має золоте оздоблення, можливо, всередині є щось цінне.
  components:
  - type: Sprite
    sprite: _Vanderlin/Structures/Storage/chest.rsi
    layers:
    - state: chest1base
      map: ["enum.StorageVisualLayers.Base"]
    - state: chest1_closed
      map: ["enum.StorageVisualLayers.Door"]
  - type: Icon
    sprite: _Vanderlin/Structures/Storage/chest.rsi
    state: icon_chest1
  - type: Appearance
  - type: EntityStorageVisuals
    stateDoorOpen: chest1open
    stateDoorClosed: chest1_closed

