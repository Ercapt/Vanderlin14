- type: entity
  id: RiverWaterEntity
  name: вода
  description: Річка на вигляд чиста, можливо, тут водиться риба.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FloorOccluder
  - type: Transform
    anchored: true
  - type: Rotatable
    rotateWhileAnchored: true
  - type: RiverCurrent
    speed: 2.5
  - type: DrowningWater
    damage:
      types:
        Asphyxiation: 2
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: _Vanderlin/Structures/Liquid/water.rsi
    drawdepth: BelowFloor
    layers:
    - state: rivermove
    - map: [ "enum.RiverBankLayer.South" ]
      state: edge-s
    - map: [ "enum.RiverBankLayer.East" ]
      state: edge-e
    - map: [ "enum.RiverBankLayer.North" ]
      state: edge-n
    - map: [ "enum.RiverBankLayer.West" ]
      state: edge-w
    color: "#6A9295"
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 9999999
        reagents:
        - ReagentId: Water
          Quantity: 9999999
  - type: DrainableSolution
    solution: pool
  - type: Edible
    edible: Drink
    solution: pool
    utensil: None
    destroyOnEmpty: false
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
      # Goobstation - fishing
      fishing:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        layer:
        - ItemMask
        mask:
        - HighImpassable
        density: 1000
        hard: false
      # Goobstation - fishing
  - type: FootstepModifier
    footstepSoundCollection:
      collection: VanderlinWaterMove
      params:
        volume: 8
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:Extinguish
  # Goobstation - fishing
  - type: FishingSpot
    fishList: !type:NestedSelector
      tableId: WaterFishingLootTable
    fishDefaultTimer: 25.0
    fishTimerVariety: 15.0
  # Goobstation - fishing

