- type: tile
  id: VanderlinGrass
  name: трава
  sprite: /Textures/_Vanderlin/Tiles/Natural/grass.png
  variants: 2
  placementVariants:
  - 0.5
  - 0.5
  edgeSpritePriority: 1
  # NB: рушій малює край СУСІДА на наш тайл, тому сторони дзеркальні:
  # файл XXXedge-n лежить у South і навпаки. Не "чинити".
