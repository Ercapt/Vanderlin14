    South: /Textures/_Vanderlin/Tiles/Natural/grassedge-n.png
    East: /Textures/_Vanderlin/Tiles/Natural/grassedge-w.png
    North: /Textures/_Vanderlin/Tiles/Natural/grassedge-s.png
    West: /Textures/_Vanderlin/Tiles/Natural/grassedge-e.png
  footstepSounds:
    collection: VanderlinFootstepGrass
  weather: true
  indestructible: true

